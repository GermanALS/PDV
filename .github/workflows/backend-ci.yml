name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv
          POSTGRES_DB: pdv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://pdv:pdv@localhost:5432/pdv_test
      JWT_SECRET_KEY: ci-secret-key-solo-para-el-workflow-de-testing

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Fail if uv.lock is out of date with pyproject.toml
        run: uv lock --check

      - run: uv sync --frozen

      - run: uv run alembic upgrade head

      - run: uv run alembic check

      - run: uv run pytest
