name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # --max-workers=1: kspDebugKotlin y kspReleaseKotlin escriben el mismo
      # JSON de room.schemaLocation (app/schemas). Ejecutarlas en paralelo
      # causo una vez un JsonDecodingException transitorio (Parte 24,
      # docs/PLAN.md) - forzar ejecucion secuencial evita la carrera sin
      # agregar el plugin androidx.room como dependencia nueva.
      - run: ./gradlew test lint --max-workers=1

      - name: Verificar que el JSON de esquema de Room commiteado sigue vigente
        run: git diff --exit-code -- app/schemas

      # B-9 (Parte 40): compila el release con R8 para que un fallo de reglas
      # keep aparezca aqui. Se firma con un keystore desechable generado en el
      # job; el APK resultante no sirve para distribuir.
      - name: Compilar la variante de release
        env:
          PDV_KEYSTORE_FILE: ${{ runner.temp }}/ci-release.jks
          PDV_KEYSTORE_PASSWORD: ci-throwaway
          PDV_KEY_ALIAS: ci
          PDV_KEY_PASSWORD: ci-throwaway
        run: |
          keytool -genkeypair -keystore "$PDV_KEYSTORE_FILE" -storetype PKCS12 \
            -storepass "$PDV_KEYSTORE_PASSWORD" -keypass "$PDV_KEY_PASSWORD" \
            -alias "$PDV_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=PDV CI"
          ./gradlew assembleRelease --max-workers=1
